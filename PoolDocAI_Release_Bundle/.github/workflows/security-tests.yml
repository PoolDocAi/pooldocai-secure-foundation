name: PoolDocAI security and migration tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Keep only the newest CI run for a PR branch active; Supabase test containers are resource-heavy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-and-worker-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate document worker syntax
        run: node --check document-worker/src/server.js
      - name: Test worker SSRF and webhook boundaries
        run: node document-worker/tests/network-webhook-boundary.test.cjs

      - name: Test conversational troubleshooting routing and script parsing
        run: node website/tests/troubleshooter-intent.test.cjs
      - name: Test troubleshooter safety stop reasonable boundaries
        run: node website/tests/safety-stop.test.cjs
      - name: Test TASK-002 troubleshooter UX, technician default, and site readiness
        run: node website/tests/task002-troubleshooter-ux.test.cjs
      - name: Test TASK-003 design tokens, logo concepts, and Option C hybrid styling
        run: node website/tests/task003-design-tokens-and-logos.test.cjs
      - name: Test monthly session entitlements, technician sync, and trial RPC scope
        run: node website/tests/monthly-sessions.test.cjs

      - name: Test Stripe billing alignment and simulated webhook replay
        run: node website/tests/stripe-simulation.test.cjs
      - name: Test Stripe checkout runtime execution and billing portal
        run: node website/tests/stripe-checkout-handler.test.cjs
      - name: Test authenticated browser state teardown and cross-account isolation
        run: node website/tests/browser-isolation.test.cjs
      - name: Test fail-closed learning approval and contributor consent verification
        run: node website/tests/learning-consent-fail-closed.test.cjs
      - name: Test staging configuration and Vercel preview fail-closed guards
        run: node website/tests/staging-config.test.cjs
      - name: Test environment-specific indexing and SEO directives
        run: node website/tests/seo-indexing.test.cjs

      - name: Validate Edge Function TypeScript syntax
        run: |
          npx --yes esbuild supabase/functions/clever-handler/index.ts --bundle --format=esm --outfile=/tmp/clever-handler-check.js --external:npm:*
          npx --yes esbuild supabase/functions/stripe-webhook/index.ts --bundle --format=esm --outfile=/tmp/stripe-webhook-check.js --external:npm:*

      - name: Start clean local Supabase and apply all migrations
        run: |
          supabase start
          supabase db reset

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run SQL security smoke tests
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/security_review.sql

      - name: Run true two-connection PostgreSQL webhook concurrency and claim-fencing test
        run: node supabase/tests/stripe-concurrency.test.cjs

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
