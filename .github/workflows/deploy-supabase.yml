name: Deploy Supabase Edge Function
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["PoolDocAI security and migration tests"]
    branches: [main]
    types:
      - completed

jobs:
  pre-deploy-validation:
    name: Verify release checks before deployment
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate document worker syntax
        run: node --check document-worker/src/server.js

      - name: Test worker SSRF and webhook boundaries
        run: node document-worker/tests/network-webhook-boundary.test.cjs

      - name: Test conversational troubleshooting routing and script parsing
        run: node website/tests/troubleshooter-intent.test.cjs

      - name: Test troubleshooter safety stop reasonable boundaries
        run: node website/tests/safety-stop.test.cjs

      - name: Test monthly session entitlements, technician sync, and trial RPC scope
        run: node website/tests/monthly-sessions.test.cjs

      - name: Validate Edge Function TypeScript syntax
        run: |
          npx --yes esbuild supabase/functions/clever-handler/index.ts --bundle --format=esm --outfile=/tmp/clever-handler-check.js --external:npm:*
          npx --yes esbuild supabase/functions/stripe-webhook/index.ts --bundle --format=esm --outfile=/tmp/stripe-webhook-check.js --external:npm:*

  deploy:
    name: Deploy to Supabase
    needs: [pre-deploy-validation]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Deploy troubleshooting Edge Function
        run: supabase functions deploy clever-handler --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Deploy Stripe webhook (stays inactive until Stripe is configured)
        run: supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
