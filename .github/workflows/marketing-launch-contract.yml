name: PoolDocAI marketing launch contract (review-only)

on:
  pull_request:
    branches:
      - review/owner-publishing-recovery
    paths:
      - "marketing-launch/**"
      - ".github/workflows/marketing-launch-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketing-review:
    name: Static contract syntax and safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Parse public release checker
        run: |
          node --check marketing-launch/check-public-release.mjs
          node --check marketing-launch/finalize-public-static-v3.mjs
          node --check marketing-launch/finalize-public-search.mjs
          node --check marketing-launch/public-guide-search.js
          node --check marketing-launch/scene-autoplay.js
          node --check marketing-launch/browser-acceptance.mjs
