name: PoolDocAI security and migration tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  migration-and-worker-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate document worker syntax
        run: node --check document-worker/src/server.js
      - name: Start clean local Supabase and apply all migrations
        run: |
          supabase start
          supabase db reset
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run SQL security smoke tests
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/security_review.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
