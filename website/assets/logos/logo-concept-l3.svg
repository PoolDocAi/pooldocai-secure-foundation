<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Concept L3: Diagnostic Gauge & Telemetry Compass (Equipment Pressure & Chemical Calibration) -->
  <defs>
    <linearGradient id="l3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051424"/>
      <stop offset="100%" stop-color="#01060d"/>
    </linearGradient>
    <linearGradient id="l3-arc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="65%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="l3-needle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Tile -->
  <rect width="512" height="512" rx="112" fill="url(#l3-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="8"/>

  <!-- Calibrated Telemetry Gauge Arc (270-degree Diagnostic Dial) -->
  <path d="M128 352 A 160 160 0 1 1 384 352" stroke="#1e293b" stroke-width="32" stroke-linecap="round"/>
  <path d="M128 352 A 160 160 0 1 1 340 144" stroke="url(#l3-arc)" stroke-width="32" stroke-linecap="round"/>

  <!-- Gauge Tick Marks -->
  <line x1="168" y1="316" x2="182" y2="304" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="134" y1="230" x2="152" y2="234" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="156" y1="148" x2="170" y2="160" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="104" x2="256" y2="124" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <line x1="356" y1="148" x2="342" y2="160" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>

  <!-- Center Hub: Precision Monogram 'P' & 'D' -->
  <circle cx="256" cy="272" r="76" fill="#0b1e36" stroke="#38bdf8" stroke-width="8"/>
  <text x="256" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-2">PD</text>

  <!-- Precision Indicator Needle Pointing to Calibrated Optimal Range -->
  <polygon points="256,236 244,140 256,120 268,140" fill="url(#l3-needle)"/>
  <circle cx="256" cy="236" r="12" fill="#f59e0b"/>
</svg>
